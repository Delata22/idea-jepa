[project]
name = "ideajepa"
version = "0.1.0"
description = "Prototype idea -> words language model (role-slot idea matrices, projective erasure, JEPA idea predictor)"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.9",
  "numpy",
  "pyyaml",
  "tensorboard",
  "matplotlib",
  "pandas",
  "scikit-learn",
  "scipy",
  "datasets",
  "tokenizers",
  "tqdm",
  "pytest",
  "tabulate>=0.10.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ideajepa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
